apiVersion: v1
kind: Pod
metadata:
  name: my-pod-2
  labels:
    app: nginx-app
    enviornment: dev
spec:
  containers:
    - name: my-container
      image: nginx
      ports:
        - containerPort: 80
    - name: sidecar-container
      image: busybox
      args: ["sleep","3600"]
      ports:
        - containerPort: 80
