apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  annotations:
    kubernetes.io/change-cause: "updated nginx image to 1.22 to 1.24"
  labels:
    app: nginx-app
    environment: dev
spec:
  replicas: 3
  selector:
    matchLabels: #equality-based selector
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80
