apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: hashicorp/http-echo
        name: http-echo
        args:
        - "-text=Hello from the backend"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  ports:
  - port: 9000
    protocol: TCP
    targetPort: 5678
  selector:
    app: backend
  type: ClusterIP
status:
  loadBalancer: {}
