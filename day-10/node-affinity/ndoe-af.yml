apiVersion: apps/v1
kind: Deployment
metadata:
  name: ns-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app1
      # anything under this template will be applied to the pods created by this deployment
  template:
    metadata:
      labels:
        app: app1
    spec:
      # nodeSelector:
      #  storage: ssd
      #  env: prod
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: storage
                operator: In
                values:
                - ssd
              - key: env
                operator: In
                values:
                - prod
      containers:
        - name: ns-deployment
          image: nginx

